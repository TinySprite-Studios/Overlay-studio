<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" aria-hidden="true" shape-rendering="crispEdges">
<style>
.alien-skin{fill:var(--frameLight,#37ff7d)}.alien-dark{fill:var(--chaser1,#0a4a1d)}.alien-light{fill:#fff;opacity:.38}
.alien-wave{transform-origin:108px 104px;animation:alien-wave .65s steps(4) infinite alternate}
.alien-actor,.alien-head,.alien-wave,.alien-left{animation-delay:var(--tss-sprite-elapsed,0ms)}
@keyframes alien-wave{from{transform:rotate(-12deg)}to{transform:rotate(30deg)}}
[data-motion="dance"] .alien-actor{transform-origin:75px 140px;animation:alien-dance .7s steps(4) infinite}
[data-motion="dance"] .alien-left{transform-origin:50px 100px;animation:alien-wave .35s steps(3) infinite alternate}
[data-motion="jump"] .alien-actor{animation:alien-jump .95s steps(6) infinite}
[data-motion="look"] .alien-head{animation:alien-look 3s steps(3) infinite}
[data-motion="look"] .alien-wave{animation:none;transform:rotate(70deg)}
@keyframes alien-dance{0%,100%{transform:translateX(-5px) rotate(-7deg)}50%{transform:translateX(5px) rotate(7deg)}}
@keyframes alien-jump{0%,100%{transform:translateY(0)}20%{transform:translateY(3px)}50%{transform:translateY(-26px)}80%{transform:translateY(0)}}
@keyframes alien-look{0%,100%{transform:translateX(0)}25%,40%{transform:translateX(-7px)}65%,80%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.alien-actor,.alien-head,.alien-wave,.alien-left{animation:none!important;transform:none!important}}
</style>
