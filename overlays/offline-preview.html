<!doctype html><html><head><meta charset="utf-8"><title>Event playground</title><style>body{margin:20px;background:#10121a;color:white;font:18px Segoe UI}button{padding:12px;margin:6px}iframe{display:block;width:90vw;height:70vh;border:1px solid #555}</style></head><body><h1>Event playground</h1><p>Local test events only. No sign-in required.</p><button data-kind="follow">Follow</button><button data-kind="sub">Subscribe</button><button data-kind="cheer">Cheer</button><button data-kind="donation">Donation</button><iframe src="../scenes/tss_starting-soon/index.html" title="Test scene"></iframe><script>document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>document.querySelector('iframe').contentWindow.postMessage({type:'alert',data:{kind:button.dataset.kind,name:'Preview viewer',detail:'Test event'}},location.origin));</script></body></html>
