<!DOCTYPE html>
<html lang="en">
<head>
<script src="../config.js"></script>
<meta charset="UTF-8" />
<title>TSS Overlay</title>
<style>
  :root{
    /* Canvas */
    --W: 1920;
    --H: 1080;

    /* Frame geometry */
    --inset: 24px;
    --radius: 18px;

    /* Frame colors */
    --frameLight: #37ff7d;     /* light green base */
    --frameGlow:  rgba(55,255,125,0.55);

    /* Chasers (dark lights) */
    --chaser1: #0a4a1d;        /* darker green */
    --chaser2: #0f7a33;        /* slightly brighter dark */
    --chaserGlow: rgba(15,122,51,0.55);
    --speed: 7s;               /* lower = faster */
    --segment: 70;             /* segment length (pathLength units) */

    /* Top boxes */
    --boxBg: rgba(0,0,0,0.35); /* transparent background */
    --boxBorder: rgba(55,255,125,0.45);
    --boxText: rgba(255,255,255,0.9);
    --boxSub: rgba(255,255,255,0.65);

    /* Bottom plate */
    --plateBg: rgba(0,0,0,0.55);
    --plateRed: #ff2a2a;
    --plateRedGlow: rgba(255,42,42,0.55);
  }

  html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  .wrap { position:absolute; inset:0; pointer-events:none; }

  /* ===== FRAME SVG LAYER ===== */
  svg { position:absolute; inset:0; width:100%; height:100%; }

  /* Compact top-centre crest and bevelled activity wings. */
  .topbar{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(860px, calc(100% - 48px));
    height:100px;
    display:flex;
    align-items:center;
    font-family:Segoe UI, Arial, sans-serif;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.65));
  }
  .wing{
    flex:1;
    min-width:0;
    height:44px;
    padding:2px;
    box-sizing:border-box;
    background:linear-gradient(180deg,var(--frameLight) 0%,var(--chaser2) 35%,var(--chaser1) 65%,var(--frameLight) 100%);
    clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 16px);
  }
  .wing-right{ transform:scaleX(-1); }
  .wing-inner{
    height:100%;
    display:flex;
    align-items:center;
    background:linear-gradient(180deg,var(--boxBg),rgba(0,0,0,.9)), var(--chaser1);
    clip-path:polygon(11px 0,100% 0,100% 100%,0 100%,0 15px);
    padding:0 30px 0 12px;
  }
  .wing-right .wing-inner{ padding:0 30px 0 12px; }
  .wing-right .box{ transform:scaleX(-1); }
  .box{
    position:relative;
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    box-sizing:border-box;
    align-items:flex-start;
    gap:5px;
    padding:3px 8px 0;
    color:var(--boxText);
  }
  .box + .box{ border-left:1px solid var(--boxBorder); }
  .activity-icon{ font-size:10px; color:var(--frameLight); text-shadow:0 0 8px var(--frameGlow); }
  .label{
    font-size:8px;
    line-height:11px;
    color:var(--boxSub);
    font-weight:800;
    letter-spacing:.7px;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .activity-value{
    position:absolute;left:6px;right:6px;top:16px;
    color:var(--boxText);font-size:16px;font-weight:700;line-height:22px;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  @media(max-width:650px){.activity-value{font-size:11px;line-height:16px;}}
  .crest{
    position:relative;
    z-index:2;
    flex:0 0 94px;
    height:94px;
    margin:0 -18px;
    border:2px solid var(--frameLight);
    border-radius:50%;
    box-sizing:border-box;
    background:linear-gradient(135deg,var(--frameLight),var(--chaser1) 23%,#07100b 51%,var(--chaser2) 83%,var(--frameLight));
    box-shadow:0 0 0 4px #07100b,0 0 0 5px var(--boxBorder),inset 0 0 0 3px var(--chaser1);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .crest::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid var(--boxBorder);
    border-radius:50%;
    background:radial-gradient(ellipse at 35% 20%,var(--chaser1),#07100b 65%);
    box-shadow:inset 0 0 0 3px #07100b;
  }
  .crest .brand{
    position:relative;
    font-family:Impact, 'Arial Black',sans-serif;
    font-size:32px;
    font-weight:900;
    font-style:italic;
    letter-spacing:-1px;
    color:var(--boxText);
    text-shadow:1px 2px 0 var(--chaser1),2px 3px 0 #030805;
    transform:rotate(-7deg);
    -webkit-text-stroke:.5px #f5fff8;
  }
  .crest-logo{
    position:absolute;
    z-index:3;
    width:72%;
    height:72%;
    object-fit:contain;
  }
  .crest-logo[hidden]{display:none;}
  .crest.has-logo .brand,.crest.has-logo .crest-signature{visibility:hidden;}
  .crest-signature{
    position:absolute;
    bottom:14px;
    color:var(--boxSub);
    font-size:5px;
    letter-spacing:1.7px;
    text-transform:uppercase;
  }
  #box-camera{
    position:absolute;
    right:var(--inset);
    bottom:92px;
    width:min(320px,28vw);
    aspect-ratio:4 / 3;
  }
  @media(max-width:650px){
    .topbar{width:calc(100% - 28px);height:76px;top:10px;}
    .crest{flex-basis:72px;height:72px;margin:0 -14px;}
    .crest .brand{font-size:25px;}
    .crest-logo{
    position:absolute;
    z-index:3;
    width:72%;
    height:72%;
    object-fit:contain;
  }
  .crest-logo[hidden]{display:none;}
  .crest.has-logo .brand,.crest.has-logo .crest-signature{visibility:hidden;}
  .crest-signature{bottom:10px;font-size:4px;letter-spacing:1px;}
    .wing{height:38px;}
    .wing-inner,.wing-right .wing-inner{padding:0 18px 0 5px;}
    .box{gap:4px;padding:0 4px;}
    .label{font-size:7px;letter-spacing:.2px;}
    .activity-icon{font-size:9px;}
  }
  @media (max-aspect-ratio:1/1){
    :root{--inset:clamp(10px,2.2vw,24px);}
    #box-camera{left:var(--inset);right:var(--inset);top:52.5%;bottom:var(--inset);width:auto;aspect-ratio:auto;}
  }
  .tss-alert{
    position:absolute;left:50%;top:65px;z-index:1;
    width:min(380px,calc(100vw - 48px));height:108px;
    transform:translate(-50%,-45px) scaleX(.13) scaleY(.25);
    opacity:0;transform-origin:50% 0;pointer-events:none;
    border:1px solid var(--frameLight);border-radius:0 0 18px 18px;
    background:linear-gradient(155deg,var(--chaser1),#06110b 45%,#020805);
    box-shadow:0 8px 28px rgba(0,0,0,.65),0 0 15px var(--frameGlow),inset 0 -3px 0 var(--chaser2);
    overflow:hidden;text-align:center;box-sizing:border-box;
    transition:transform .45s cubic-bezier(.22,.8,.25,1),opacity .2s;
  }
  .topbar{z-index:2;}
  .tss-alert.dropping{opacity:1;transform:translate(-50%,48px) scaleX(.13) scaleY(1);}
  .tss-alert.open{opacity:1;transform:translate(-50%,48px) scaleX(1) scaleY(1);}
  .tss-alert-content{padding:17px 18px 12px;opacity:0;transition:opacity .2s;}
  .tss-alert.open .tss-alert-content{opacity:1;transition-delay:.25s;}
  .tss-alert-type{color:var(--frameLight);font:800 10px Segoe UI,sans-serif;letter-spacing:2.5px;text-transform:uppercase;}
  .tss-alert-name{color:var(--boxText);font:800 25px Segoe UI,sans-serif;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tss-alert-detail{color:var(--boxSub);font:12px Segoe UI,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media(max-width:650px){.tss-alert{top:45px;}.tss-alert-name{font-size:21px;}}
  @media(prefers-reduced-motion:reduce){.tss-alert,.tss-alert-content{transition:none;}}
</style>
<style>
  .tss-sprite { position:absolute; z-index:5; bottom:0; right:clamp(24px,8vw,180px); width:150px; height:180px;
    pointer-events:none; color:var(--frameLight); transform:translateY(190px);
    animation:tss-sprite-peek 15s both; animation-delay:var(--tss-sprite-elapsed,0ms); }
  .tss-sprite[hidden] { display:none; }
  .tss-sprite-body { position:absolute; left:28px; bottom:12px; width:94px; height:105px; border-radius:48% 48% 40% 40%;
    border:2px solid currentColor; background:radial-gradient(ellipse at 30% 20%,#e4fff1 0%,var(--frameLight) 18%,var(--chaser2) 65%,var(--chaser1) 100%);
    box-shadow:inset -9px -8px 16px #001b1888,0 0 22px var(--frameGlow); }
  .tss-sprite-body::before { content:''; position:absolute; left:38px; top:-27px; width:22px; height:32px;
    border-radius:90% 0 90% 0; background:linear-gradient(30deg,var(--chaser2),#caffdd); transform:rotate(-20deg); }
  .tss-sprite-eye { position:absolute; top:34px; width:14px; height:22px; border-radius:50%; background:#071a19;
    box-shadow:inset 3px 4px 0 #fff; }
  .tss-sprite-eye.left { left:23px; } .tss-sprite-eye.right { right:23px; }
  .tss-sprite-smile { position:absolute; top:61px; left:36px; width:20px; height:10px; border-bottom:3px solid #071a19; border-radius:0 0 50% 50%; }
  .tss-sprite-badge { position:absolute; bottom:9px; left:0; right:0; text-align:center; color:#eafff5; font:700 9px Segoe UI,sans-serif; letter-spacing:2px; }
  .tss-sprite-arm { position:absolute; right:7px; bottom:65px; width:19px; height:42px; border:2px solid var(--chaser1);
    border-radius:60%; background:linear-gradient(90deg,var(--chaser2),var(--frameLight)); transform-origin:50% 100%;
    animation:tss-sprite-wave .65s ease-in-out infinite alternate; animation-delay:var(--tss-sprite-elapsed,0ms); }
  .tss-sprite-wing { position:absolute; left:5px; bottom:39px; width:45px; height:67px; border-radius:80% 10% 70% 30%;
    transform:rotate(-28deg); background:linear-gradient(45deg,transparent,#cffffaaa); border:1px solid #cffffa99; }
  .tss-sprite-caption { position:absolute; bottom:158px; left:50%; transform:translateX(-50%); width:210px;
    padding:7px 10px; border:1px solid currentColor; border-radius:12px; background:#06110bef;
    color:#f0fff5; font:600 12px/1.3 Segoe UI,sans-serif; text-align:center; white-space:pre-wrap; overflow-wrap:anywhere; box-sizing:border-box; }
  @keyframes tss-sprite-peek { 0%,100% { transform:translateY(190px); } 12%,25% { transform:translateY(65px) rotate(-8deg); }
    35%,84% { transform:translateY(0) rotate(0); } 93% { transform:translateY(65px) rotate(8deg); } }
  @keyframes tss-sprite-wave { from { transform:rotate(-15deg); } to { transform:rotate(38deg); } }
  @media(prefers-reduced-motion:reduce) { .tss-sprite { animation:none; transform:none; } .tss-sprite-arm { animation:none; } }
</style>

<style>
.tss-tomato-scene{position:absolute;z-index:7;bottom:105px;right:clamp(24px,8vw,180px);width:150px;height:150px;pointer-events:none;animation:tomato-scene 15s both;animation-delay:var(--tss-sprite-elapsed,0ms)}
.tss-tomato-scene{bottom:auto;right:auto}
.tss-tomato-scene[hidden]{display:none}
.tss-tomato-projectile{position:absolute;left:53px;top:53px;width:45px;height:42px;background:#ee3434;border:5px solid #a81a27;border-radius:45%;box-shadow:inset 6px 4px #ff7970;animation:tomato-throw 15s linear both;animation-delay:var(--tss-sprite-elapsed,0ms)}

@keyframes tomato-clean{0%,8%{opacity:0;clip-path:inset(0)}9%{opacity:1;clip-path:inset(0);transform:scale(.85)}11%{opacity:1;clip-path:inset(0);transform:scale(1.08)}14%,45%{opacity:1;clip-path:inset(0);transform:scale(1)}55%{opacity:1;clip-path:inset(0 0 25% 0)}65%{opacity:1;clip-path:inset(0 0 55% 0)}76%,100%{opacity:0;clip-path:inset(0 0 100% 0)}}

0%,14%{transform:translate(var(--tomato-home-x),var(--tomato-off-y))}
22%{transform:translate(var(--tomato-home-x),var(--tomato-home-y))}
40%,78%{transform:translate(var(--tomato-target-x),var(--tomato-target-y))}

</style>

<body>
<div class="wrap">

  <!-- SVG frame + true border-chasing lights (NO diagonal streaks) -->
  <svg class="outer-frame" preserveAspectRatio="none">
    <defs>
      <!-- Glow filter -->
      <filter id="gGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="cGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Geometry -->
    <!-- pathLength=1000 makes dash math easy and consistent -->
    <rect
      x="6" y="6"
      width="calc(100% - 12px)" height="calc(100% - 12px)"
      rx="18" ry="18"
      fill="none"
      stroke="var(--frameLight)"
      stroke-width="4"
      filter="url(#gGlow)"
      pathLength="1000"
      style="filter: drop-shadow(0 0 18px var(--frameGlow));"
    />

    <!-- Chaser 1 -->
    <rect
      x="6" y="6"
      width="calc(100% - 12px)" height="calc(100% - 12px)"
      rx="18" ry="18"
      fill="none"
      stroke="var(--chaser1)"
      stroke-width="7"
      stroke-linecap="round"
      pathLength="1000"
      stroke-dasharray="70 930"
      filter="url(#cGlow)"
    >
      <animate attributeName="stroke-dashoffset"
               values="0;-1000"
               dur="27s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Chaser 2 (same direction, opposite side => offset 500) -->
    <rect
      x="6" y="6"
      width="calc(100% - 12px)" height="calc(100% - 12px)"
      rx="18" ry="18"
      fill="none"
      stroke="var(--chaser2)"
      stroke-width="7"
      stroke-linecap="round"
      pathLength="1000"
      stroke-dasharray="70 930"
      filter="url(#cGlow)"
      opacity="0.95"
    >
      <animate attributeName="stroke-dashoffset"
               values="500;-500"
               dur="27s"
               repeatCount="indefinite"/>
    </rect>

  </svg>

  <div id="box-camera">
    <svg viewBox="0 0 332 252" preserveAspectRatio="none">
      <defs>
        <!-- Glow filter -->
        <filter id="gGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="cGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Geometry -->
      <!-- pathLength=1000 makes dash math easy and consistent -->
      <rect
        x="6" y="6"
        width="320" height="240"
        rx="18" ry="18"
        fill="none"
        stroke="var(--frameLight)"
        stroke-width="4"
        filter="url(#gGlow)"
        pathLength="1000"
        style="filter: drop-shadow(0 0 18px var(--frameGlow));"
      />

      <!-- Chaser 1 -->
      <rect
        x="6" y="6"
        width="320" height="240"
        rx="18" ry="18"
        fill="none"
        stroke="var(--chaser1)"
        stroke-width="5"
        stroke-linecap="round"
        pathLength="1000"
        stroke-dasharray="70 930"
        filter="url(#cGlow)"
      >
        <animate attributeName="stroke-dashoffset"
                values="0;-1000"
                dur="17s"
                repeatCount="indefinite"/>
      </rect>

      <!-- Chaser 2 (same direction, opposite side => offset 500) -->
      <rect
        x="6" y="6"
        width="320" height="240"
        rx="18" ry="18"
        fill="none"
        stroke="var(--chaser2)"
        stroke-width="5"
        stroke-linecap="round"
        pathLength="1000"
        stroke-dasharray="70 930"
        filter="url(#cGlow)"
        opacity="0.95"
      >
        <animate attributeName="stroke-dashoffset"
                values="500;-500"
                dur="17s"
                repeatCount="indefinite"/>
      </rect>

    </svg>
  </div>

  <!-- Existing activity IDs remain available for browser-source integrations. -->
  <div class="topbar" aria-label="Stream activity">
    <div class="wing wing-left" id="wing-left">
      <div class="wing-inner">
        <div class="box" id="box-donator"><span class="activity-icon" aria-hidden="true">&#9670;</span><span class="label" id="label-donator"></span></div>
        <div class="box" id="box-subscriber"><span class="label" id="label-subscriber"></span><span class="activity-icon" aria-hidden="true">&#9733;</span></div>
      </div>
    </div>
    <div class="crest" id="box-tss" aria-label="TinySprite TSS">
      <img class="crest-logo" id="crest-logo" alt="TinySprite logo" hidden>
      <span class="brand">TSS</span><span class="crest-signature">TinySprite</span>
    </div>
    <div class="wing wing-right" id="wing-right">
      <div class="wing-inner">
        <div class="box" id="box-cheerer"><span class="activity-icon" aria-hidden="true">&#9830;</span><span class="label" id="label-cheerer"></span></div>
        <div class="box" id="box-follower"><span class="activity-icon" aria-hidden="true">&#9829;</span><span class="label" id="label-follower"></span></div>
      </div>
    </div>
  </div>

  <div class="tss-alert" id="tss-alert" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <div class="tss-alert-content">
      <div class="tss-alert-type" id="tss-alert-type"></div>
      <div class="tss-alert-name" id="tss-alert-name"></div>
      <div class="tss-alert-detail" id="tss-alert-detail"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const cfg = window.OVERLAY_CONFIG || {};

  const logo = cfg.logo || {};
  const logoImage = document.getElementById("crest-logo");
  const crest = document.getElementById("box-tss");
  if (typeof logo.src === "string" && logo.src.trim()) {
    logoImage.alt = logo.alt || "TinySprite logo";
    logoImage.onload = () => {
      logoImage.hidden = false;
      crest.classList.add("has-logo");
      crest.setAttribute("aria-label", logoImage.alt);
    };
    logoImage.onerror = () => {
      logoImage.hidden = true;
      crest.classList.remove("has-logo");
      crest.setAttribute("aria-label", "TinySprite TSS");
    };
    logoImage.src = logo.src.trim();
  }

  // Expose the active shape for browser-source debugging and custom styling.
  const updateCanvasShape = () => {
    const portrait = window.innerHeight > window.innerWidth;
    root.dataset.layout = portrait ? "vertical" : "horizontal";
  };

  // Apply theme to :root CSS variables
  const theme = (cfg.theme || {});
  const motion = (cfg.motion || {});

  const root = document.documentElement;
  updateCanvasShape();
  window.addEventListener("resize", updateCanvasShape);

  // Helper: set CSS variable if provided
  const setVar = (name, value) => {
    if (value !== undefined && value !== null && value !== "") {
      root.style.setProperty(name, value);
    }
  };

  setVar("--frameLight", theme.frameLight);
  setVar("--frameGlow",  theme.frameGlow);

  setVar("--chaser1", theme.chaser1);
  setVar("--chaser2", theme.chaser2);
  setVar("--chaserGlow", theme.chaserGlow);

  setVar("--boxBg", theme.boxBg);
  setVar("--boxBorder", theme.boxBorder);
  setVar("--boxText", theme.boxText);
  setVar("--boxSub", theme.boxSub);

  setVar("--plateBg", theme.plateBg);
  setVar("--plateRed", theme.plateRed);
  setVar("--plateRedGlow", theme.plateRedGlow);

  if (motion.speedSeconds) {
    setVar("--speed", motion.speedSeconds + "s");
  }

  // Select the independent horizontal/vertical content configuration.
  const canvasLayout = window.innerHeight > window.innerWidth
    ? "vertical"
    : "horizontal";
  const layoutConfig = (cfg.layouts && cfg.layouts[canvasLayout]) || cfg;

  // Toggle boxes
  const boxes = (layoutConfig.boxes || {});
  const setVisible = (id, visible) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.display = visible ? "" : "none";
  };

  setVisible("box-camera", !!boxes.camera);
  setVisible("box-tss", !!boxes.tss);

  setVisible("box-donator", !!boxes.donator);
  setVisible("box-follower", !!boxes.follower);
  setVisible("box-cheerer", !!boxes.cheerer);
  setVisible("box-subscriber", !!boxes.subscriber);
  setVisible("wing-left", !!(boxes.donator || boxes.subscriber));
  setVisible("wing-right", !!(boxes.cheerer || boxes.follower));

  // Update labels/values
  const labels = (layoutConfig.labels || {});
  const setText = (id, text) => {
    const el = document.getElementById(id);
    if (el && text !== undefined) el.textContent = text;
  };

  const applyLabel = (name) => {
    const el = document.getElementById("label-" + name);
    const setting = labels[name];
    if (!el || setting === undefined) return;

    // Object form supports independent visibility; strings remain supported.
    if (typeof setting === "object" && setting !== null) {
      setText("label-" + name, setting.text || "");
      el.style.visibility = setting.enabled === false ? "hidden" : "visible";
    } else {
      setText("label-" + name, setting);
      el.style.visibility = "visible";
    }
  };

  ["donator", "follower", "cheerer", "subscriber"].forEach(applyLabel);

  // The local helper serves names only; Twitch credentials never reach the overlay.
  ["follower", "subscriber", "cheerer", "donator"].forEach(name => {
    const value = document.createElement("span");
    value.className = "activity-value";
    value.id = "value-" + name;
    document.getElementById("box-" + name).appendChild(value);
  });
  if (location.protocol === "http:" && location.hostname === "127.0.0.1") {
    const events = new EventSource("/events");
    if (window.TSSCare) window.TSSCare.connect(events);
    if (window.TSSPaint) window.TSSPaint.connect(events);
    if (window.TSSSummon) window.TSSSummon.connect(events);
    if (window.TSSAlerts) events.addEventListener('alert', message => {
      try { window.TSSAlerts.enqueue(JSON.parse(message.data)); } catch (_) {}
    });
    events.onmessage = message => {
      try {
        const activity = JSON.parse(message.data);
        ["follower", "subscriber", "cheerer", "donator"].forEach(name => setText("value-" + name, activity[name] || ""));
      } catch (_) { /* Keep the last names if an update is incomplete. */ }
    };
  }

})();
</script>
